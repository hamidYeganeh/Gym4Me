services:
  mongo:
    image: mongo:7
    container_name: gym4me-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - gym4me_mongodata:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: gym4me-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - gym4me_redisdata:/data

volumes:
  gym4me_mongodata:
  gym4me_redisdata:
