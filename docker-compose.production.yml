services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: ${GYM4ME_ENV_FILE:-.env.production}
    environment:
      MONGODB_URI: mongodb://mongodb:27017/gym4me?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      UPLOAD_STORAGE_PATH: /app/var/uploads
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - gym4me_uploads:/app/var/uploads
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: ${GYM4ME_ENV_FILE:-.env.production}
    environment:
      MONGODB_URI: mongodb://mongodb:27017/gym4me?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      FCM_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-push-service-account.json
      APNS_ENABLED: ${APNS_ENABLED:-false}
    volumes:
      - ${FCM_SERVICE_ACCOUNT_FILE_HOST:-./apps/worker/.secrets/firebase-push-service-account.json}:/run/secrets/firebase-push-service-account.json:ro
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - gym4me_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  mongodb-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      [
        "mongosh",
        "--host",
        "mongodb:27017",
        "--quiet",
        "--eval",
        "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }",
      ]
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - gym4me_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=30d",
      ]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics_token:/run/secrets/metrics_token:ro
      - gym4me_prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-before-enabling-monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - gym4me_grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]

volumes:
  gym4me_mongodb_data:
  gym4me_redis_data:
  gym4me_uploads:
  gym4me_prometheus_data:
  gym4me_grafana_data:
