name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      # Read-only: workspace lint scripts must not mutate sources (no --fix).
      - name: Lint
        run: npm run lint

      # Next apps run `next typegen` before tsc so check-types does not depend
      # on a stale local `.next` from `next dev`.
      - name: Typecheck
        run: npm run check-types

      - name: Build API
        run: npm run build -w api

      - name: Build admin
        run: npm run build -w admin

      - name: Build website
        run: npm run build -w website
        timeout-minutes: 20

      - name: Build mobile
        run: npm run build -w mobile
        timeout-minutes: 25
