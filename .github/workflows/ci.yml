name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Tehran
  NODE_ENV: test
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_FETCH_RETRIES: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"
  JWT_ACCESS_SECRET: ci-access-secret-that-is-longer-than-thirty-two-characters
  JWT_PASSWORD_RESET_SECRET: ci-password-reset-secret-that-is-longer-than-thirty-two
  SMS_PROVIDER: mock
  PAYMENT_PROVIDER: mock
  PUSH_PROVIDER: mock
  KYC_PROVIDER: mock
  DEBUG_MODE: "true"
  THROTTLE_DISABLED: "true"

jobs:
  quality:
    name: Lint and type safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read-only lint
        run: npm run lint
      - name: Typecheck all workspaces
        run: npm run check-types

  unit:
    name: API unit tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Tehran
            timezone: Asia/Tehran
          - label: UTC
            timezone: UTC
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage artifact
        run: npm run test:cov --workspace=backend -- --runInBand
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-unit-coverage-${{ matrix.label }}
          path: apps/api/coverage
          if-no-files-found: warn

  frontend-tests:
    name: Frontend route, form and adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test mobile, admin, website and shared API adapters
        run: npm run test:frontend

  integration:
    name: Mongo/Redis integration and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MONGODB_URI: mongodb://127.0.0.1:27018/gym4me_ci?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://127.0.0.1:6380
      API_BASE_URL: http://127.0.0.1:8088
      API_URL: http://127.0.0.1:8088/api/v1
      API_ROOT: http://127.0.0.1:8088/api
      API_LOG_FILE: /tmp/gym4me-api-ci.log
      UPLOAD_DIR: /tmp/gym4me-ci-uploads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start replica-set MongoDB and Redis
        run: docker compose up -d mongo redis
      - name: Wait for infrastructure
        run: |
          for attempt in {1..36}; do
            mongo_health=$(docker inspect --format='{{.State.Health.Status}}' gym4me-mongo 2>/dev/null || true)
            redis_ok=$(docker exec gym4me-redis redis-cli ping 2>/dev/null || true)
            if [ "$mongo_health" = "healthy" ] && [ "$redis_ok" = "PONG" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs mongo redis
          exit 1
      - name: Seed isolated integration database
        run: npm run db:seed:all --workspace=backend
      - name: Build and start API
        run: |
          npm run build --workspace=backend
          node apps/api/dist/main.js > "$API_LOG_FILE" 2>&1 &
          echo $! > /tmp/gym4me-api-ci.pid
          for attempt in {1..36}; do
            if curl --fail --silent http://127.0.0.1:8088/api/v1/ready >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          tail -n 300 "$API_LOG_FILE"
          exit 1
      - name: API e2e test
        run: npm run test:e2e --workspace=backend -- --runInBand
      - name: OpenAPI contract smoke
        run: |
          curl --fail --silent http://127.0.0.1:8088/docs/swagger-json -o /tmp/gym4me-openapi.json
          jq -e '.openapi and (.paths | length > 40)' /tmp/gym4me-openapi.json
          jq -e '.paths["/api/v1/account/bookings"] and .paths["/api/v1/account/memberships"]' /tmp/gym4me-openapi.json
      - name: Critical product smoke flows
        run: |
          node apps/api/test/worker-concurrency.cjs
          node apps/api/test/booking-concurrency.cjs
          bash apps/api/test/smoke-bootstrap-progress.sh
          bash apps/api/test/smoke-booking.sh
          bash apps/api/test/smoke-membership.sh
          bash apps/api/test/integrity-flows.sh
          bash apps/api/test/e2e-scenario.sh
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-evidence
          path: |
            /tmp/gym4me-api-ci.log
            /tmp/gym4me-openapi.json
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/gym4me-api-ci.pid ]; then kill "$(cat /tmp/gym4me-api-ci.pid)" || true; fi
          docker compose down -v

  build:
    name: Build ${{ matrix.workspace }}
    needs: [quality, unit, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, admin, website, mobile]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build Next workspace
        run: npm run build --workspace=${{ matrix.workspace }} -- --webpack
        if: matrix.workspace == 'mobile' || matrix.workspace == 'website'
      - name: Build workspace
        run: npm run build --workspace=${{ matrix.workspace }}
        if: matrix.workspace == 'backend' || matrix.workspace == 'admin'
