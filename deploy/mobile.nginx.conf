server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Next.js static export: prefer exact file, then .html, then directory index.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
