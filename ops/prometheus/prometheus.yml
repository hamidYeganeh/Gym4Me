global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gym4me-api
    metrics_path: /api/v1/health/metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: [api:4000]
  - job_name: gym4me-worker
    metrics_path: /metrics
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: [worker:4001]
